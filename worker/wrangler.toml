name = "hesabu-registry"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Your own pages (the Hesabu app) are served by Cloudflare Pages; this Worker only holds the registry.

[[d1_databases]]
binding = "DB"
database_name = "hesabu"
# Run:  npx wrangler d1 create hesabu   then paste the database_id it prints here
database_id = "PASTE-THE-ID-HERE"

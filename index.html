<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0E5A52" />
    <meta name="description" content="Record sales and track stock in your shop, even without internet." />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>Hesabu</title>
  </head>
  <body>
    <div id="root">
      <style>
        .boot{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;background:#f7f5ef;color:#0E5A52;font-family:system-ui,sans-serif}
        .boot i{width:34px;height:34px;border:4px solid #0E5A5233;border-top-color:#0E5A52;border-radius:50%;animation:bootspin .8s linear infinite}
        @keyframes bootspin{to{transform:rotate(360deg)}}
        @media (prefers-color-scheme:dark){.boot{background:#101614;color:#9ad5cb}.boot i{border-color:#9ad5cb33;border-top-color:#9ad5cb}}
      </style>
      <div class="boot" role="status"><img src="icon.svg" alt="" width="72" height="72" /><i></i><span>Opening Hesabu…</span></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
